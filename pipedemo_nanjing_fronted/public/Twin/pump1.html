<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=250, height=180, user-scalable=no" />
    <title>泵站监测信息</title>
    <style>
        @font-face {
            font-family: "YouSheBiaoTiHei";
            src: url("@/assets/fonts/YouSheBiaoTiHei-2.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: "AliMaMaShuHeiTi";
            src: url("@/assets/fonts/阿里妈妈数黑体.ttf") format("truetype");
        }

        @font-face {
            font-family: "AlimamaAgileVF";
            src: url("@/assets/fonts/AlimamaAgileVF-Thin.ttf") format("truetype");
        }

        body {
            margin: 0;
            font-family: "AlimamaAgileVF", sans-serif;
            background: rgba(23, 50, 88, 0.6);
            backdrop-filter: blur(6px);
            color: #ffffff;
            font-size: 14px;
            width: 220px;
            height: 170px;
            overflow: hidden;
            border-radius: 11px;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.8);
        }

        /* ===== Header ===== */
        .header {
            background: rgba(23, 50, 88, 0.6);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid rgba(248, 248, 248, 0.4);
            color: #ffffff;
            font-weight: 600;
            padding: 6px 10px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-family: "YouSheBiaoTiHei", sans-serif;
        }

        /* ===== Content ===== */
        .content {
            background: rgba(23, 50, 88, 0.6);
            backdrop-filter: blur(6px);
            padding: 9px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ===== Rows ===== */
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .label {
            color: rgba(214, 245, 255, 0.85);
            min-width: 60px;
            font-size: 12px;
            font-family: "YouSheBiaoTiHei", Arial, sans-serif;
        }

        .value {
            font-weight: 600;
            color: #ffffff;
            font-size: 12px;
            font-family: "YouSheBiaoTiHei", sans-serif;
        }

        /* ===== Status Dots ===== */
        .status-dots {
            display: flex;
            gap: 4px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(214, 245, 255, 0.4);
        }

        /* 运行中（冷青绿） */
        .dot.green {
            background: rgba(0, 255, 200, 0.85);
            box-shadow: 0 0 6px rgba(0, 255, 200, 0.8);
        }

        /* 异常（冷红，压饱和） */
        .dot.red {
            background: rgba(255, 80, 80, 0.8);
            box-shadow: 0 0 6px rgba(255, 80, 80, 0.6);
        }

        /* 未启用 */
        .dot.gray {
            background: rgba(180, 190, 200, 0.6);
            box-shadow: 0 0 4px rgba(180, 190, 200, 0.4);
        }

        /* ===== Button ===== */
        button {
            background: linear-gradient(180deg,
                    rgba(36, 104, 190, 0.4),
                    rgba(0, 144, 211, 0.8));
            color: #ffffff;
            font-weight: 600;
            font-family: "ALMMAVF", sans-serif;
            border: 1px solid rgba(214, 245, 255, 0.4);
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 12px;
            box-shadow: 0 0 6px rgba(0, 191, 255, 0.6);
            transition: all 0.3s ease;
        }

        button:hover {
            box-shadow: 0 0 12px rgba(0, 191, 255, 1);
            transform: scale(1.05);
        }

        /* ===== Footer ===== */
        .footer {
            margin-top: 8px;
            text-align: right;
            font-size: 12px;
            color: rgba(214, 245, 255, 0.8);
        }
    </style>
</head>

<body>
    <div class="header">
        <div>吴家村</div>
        <div>
            <button id="btnCurve">曲线</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const index = urlParams.get("index") || 0;

        document.getElementById("btnCurve").addEventListener("click", () => {
            if (typeof w51_event === "function") {
                w51_event("openCurve", { station: "pump1", index: Number(index), type: "pump1" });
            } else {
                console.warn("⚠️ 当前不在 WDP 环境中,w51_event 不可用");
            }
        });
    </script>

    <div class="content">
        <div class="row">
            <div class="label">瞬时抽升量：</div>
            <div class="value">9.7万/日</div>
        </div>

        <div class="row">
            <div class="label">运行状态：</div>
            <div class="status-dots">
                <div class="dot green"></div>
                <div class="dot red"></div>
                <div class="dot red"></div>
                <div class="dot green"></div>
            </div>
        </div>

        <div class="row">
            <div class="label">抽前液位：</div>
            <div class="value">4.75m</div>
        </div>

        <div class="row">
            <div class="label">溢流液位：</div>
            <div class="value">5.62m</div>
        </div>

        <div class="row">
            <div class="label">目前目标液位：</div>
            <div class="value">3.50m</div>
        </div>

        <div class="row">
            <div class="label">跨越状态：</div>
            <div class="value">无跨越</div>
        </div>
    </div>
</body>

</html>
