<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=220, height=200, user-scalable=no" />
    <title>泵站监测信息</title>
    <style>
        @font-face {
            font-family: "YouSheBiaoTiHei";
            src: url("http://10.100.10.124:8090/inundation/poi/fonts/YouSheBiaoTiHei-2.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: "AliMaMaShuHeiTi";
            src: url("http://10.100.10.124:8090/inundation/poi/fonts/阿里妈妈数黑体.ttf") format("truetype");
        }

        @font-face {
            font-family: "AlimamaAgileVF";
            src: url("http://10.100.10.124:8090/inundation/poi/fonts/AlimamaAgileVF-Thin.ttf") format("truetype");
        }

        body {
            font-family: "AlimamaAgileVF", sans-serif;
            color: #ffffff;
            overflow: hidden;
            width: 220px;
            height: 200px;
        }

        .pump-card {
            background: url("http://10.100.10.124:8090/inundation/poi/poi-window-bg.png") no-repeat center / contain;
            width: 220px;
            height: 200px;
            display: flex;
            flex-direction: column;
        }

        /* ===== Header ===== */
        .header-container {
            display: flex;
            justify-content: center;
            margin-bottom: 6px;
        }

        .header {
            background: url("http://10.100.10.124:8090/inundation/poi/poi-window-title-bg.png") no-repeat center / contain;
            width: 184px;
            height: 24px;
            color: #ffffff;
            padding: 6px 10px;
            font-size: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: "YouSheBiaoTiHei", sans-serif;
            margin: 6px 10px;
        }

        /* ===== Content ===== */
        .content {
            font-family: "AlimamaAgileVF", sans-serif;
            padding: 1px 15px;
            display: flex;
            flex-direction: column;
        }

        .content>*+* {
            margin-top: 5px;
        }

        /* ===== Rows ===== */
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .label {
            color: rgba(214, 245, 255, 0.85);
            min-width: 60px;
            font-size: 12px;
        }

        .value {
            font-weight: 600;
            color: #ffffff;
            font-size: 12px;
        }

        /* ===== Status Dots ===== */
        .status-dots {
            display: flex;
        }

        .status-dots>*+* {
            margin-left: 4px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(214, 245, 255, 0.4);
        }

        /* 运行中（冷青绿） */
        .dot.green {
            background: rgba(0, 255, 200, 0.85);
            box-shadow: 0 0 6px rgba(0, 255, 200, 0.8);
        }

        /* 异常（冷红，压饱和） */
        .dot.red {
            background: rgba(255, 80, 80, 0.8);
            box-shadow: 0 0 6px rgba(255, 80, 80, 0.6);
        }

        /* 未启用 */
        .dot.gray {
            background: rgba(180, 190, 200, 0.6);
            box-shadow: 0 0 4px rgba(180, 190, 200, 0.4);
        }

        /* ===== Button ===== */
        .header-button {
            background: url("http://10.100.10.124:8090/inundation/poi/poi-window-button-bg.png") no-repeat center / contain;
            width: 49px;
            height: 18px;
            font-size: 12px;
            font-weight: 600;
            font-family: "AlimamaAgileVF", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .header-button:hover {
            transform: scale(1.05);
        }

        /* ===== Footer ===== */
        .footer {
            margin-top: 8px;
            text-align: right;
            font-size: 12px;
            color: rgba(214, 245, 255, 0.8);
        }
    </style>
</head>

<body>
    <div class="pump-card">
        <div class="header-container">
            <div class="header">
                <div>吴家村</div>
                <div>
                    <div class="header-button" id="btnCurve">曲线</div>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="row">
                <div class="label">瞬时抽升量：</div>
                <div class="value">9.7万/日</div>
            </div>

            <div class="row">
                <div class="label">运行状态：</div>
                <div class="status-dots">
                    <div class="dot green"></div>
                    <div class="dot red"></div>
                    <div class="dot red"></div>
                    <div class="dot green"></div>
                </div>
            </div>

            <div class="row">
                <div class="label">抽前液位：</div>
                <div class="value">4.75m</div>
            </div>

            <div class="row">
                <div class="label">溢流液位：</div>
                <div class="value">5.62m</div>
            </div>

            <div class="row">
                <div class="label">目前目标液位：</div>
                <div class="value">3.50m</div>
            </div>

            <div class="row">
                <div class="label">跨越状态：</div>
                <div class="value">无跨越</div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const index = urlParams.get("index") || 0;

        document.getElementById("btnCurve").addEventListener("click", () => {
            if (typeof w51_event === "function") {
                w51_event("openCurve", { station: "pump1", index: Number(index), type: "pump1" });
            } else {
                console.warn("⚠️ 当前不在 WDP 环境中,w51_event 不可用");
            }
        });
    </script>
</body>

</html>
