<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=353, height=227, user-scalable=no" />
  <title>泵站曲线监测</title>
  <script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>

  <style>
    @font-face {
      font-family: "YouSheBiaoTiHei";
      src: url("http://10.100.10.124:8090/inundation/poi/fonts/YouSheBiaoTiHei-2.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: "AliMaMaShuHeiTi";
      src: url("http://10.100.10.124:8090/inundation/poi/fonts/阿里妈妈数黑体.ttf") format("truetype");
    }

    @font-face {
      font-family: "AlimamaAgileVF";
      src: url("http://10.100.10.124:8090/inundation/poi/fonts/AlimamaAgileVF-Thin.ttf") format("truetype");
    }

    body {
      font-family: "SimHei", Arial, sans-serif;
      overflow: hidden;
      margin: 0;
      width: 353px;
      height: 227px;
    }

    .pump-curve-card {
      background: url("http://10.100.10.124:8090/inundation/poi/poi-window-curve-bg.png") no-repeat center / contain;
      width: 353px;
      height: 227px;
    }

    /* 标题栏样式 */
    .header {
      color: #fff;
      padding: 13px 25px;
      font-size: 15px;
      font-weight: 600;
      font-family: "AliMaMaShuHeiTi", Arial, sans-serif;
      user-select: none;
      display: flex;
      justify-content: space-between;
      height: 0px;
    }

    /* 关闭按钮样式 */
    .close-button {
      background: url("http://10.100.10.124:8090/inundation/poi/curve-btn.png") no-repeat center / contain;
      width: 14px;
      height: 14px;
      cursor: pointer;
      transition: all 0.1s ease-in-out;
    }

    .close-button:hover {
      transform: scale(1.2);
      filter: drop-shadow(0 0 4px rgba(0, 191, 255, 0.6));
    }

    #chart {
      width: 100%;
      height: calc(100% - 0px);
      margin-left: 8px;
    }
  </style>
</head>

<body>
  <div class="pump-curve-card">
    <div class="header">
      <div>雨量曲线监测</div>
      <div class="close-button" id="closeBtn"></div>
    </div>

    <div id="chart"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const index = urlParams.get("index") || 0;

    const chart = echarts.init(document.getElementById("chart"));

    const option = {
      tooltip: {
        trigger: "axis",
        backgroundColor: 'rgba(79, 99, 113, 0.9)',
        borderColor: '#00bfff',
        borderWidth: 1,
        textStyle: {
          color: '#ffffff',
          fontSize: 12
        }
      },
      xAxis: {
        type: "category",
        data: ["10:00", "10:05", "10:10", "10:15", "10:20", "10:25", "10:30", "10:35"],
        axisLine: {
          lineStyle: {
            color: '#ffffff'
          }
        },
        axisLabel: {
          color: '#ffffff',
          fontSize: 10
        }
      },
      yAxis: {
        type: "value",
        name: "雨量 (mm)",
        min: 3.0,
        max: 8.0,
        nameTextStyle: {
          color: '#ffffff',
          fontSize: 12
        },
        axisLine: {
          lineStyle: {
            color: '#ffffff'
          }
        },
        axisLabel: {
          color: '#ffffff',
          fontSize: 12
        },
        splitLine: {
          lineStyle: {
            color: 'rgba(255, 255, 255, 0.2)'
          }
        }
      },
      series: [
        {
          name: "液位",
          type: "line",
          smooth: true,
          data: [3.8, 4.1, 4.3, 4.7, 4.9, 5.2, 7.5, 5.8],
          areaStyle: {
            color: "rgba(30, 189, 208, 0.3)",
          },
          lineStyle: {
            color: "#00bfff",
            width: 3
          },
          itemStyle: {
            color: '#00bfff'
          },
          symbolSize: 9
        },
      ],
    };

    chart.setOption(option);

    // 点击关闭按钮 -> 通知主程序隐藏窗口
    document.getElementById("closeBtn").addEventListener("click", () => {
      if (typeof w51_event === "function") {
        w51_event("closeCurve", {
          station: "rain1",
          type: "rain1",
          index: Number(index),
        });
      }
    });
  </script>
</body>

</html>
